name: Deploy to GitHub Pages

on:
  push:
    branches: [ github-page ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build with Next.js
        run: npm run build
        env:
          NODE_ENV: production

      - name: List files for debugging
        run: |
          echo "Current directory contents:"
          ls -la
          echo "Checking if out directory exists:"
          if [ -d "out" ]; then
            echo "out directory exists"
            ls -la out/
          else
            echo "out directory not found"
          fi
          echo "Checking .next directory:"
          if [ -d ".next" ]; then
            ls -la .next/
          else
            echo ".next directory not found"
          fi
          echo "Finding all directories:"
          find . -type d -name "*out*" -o -name "*export*" -o -name "*build*" | head -20

      - name: Check and create out directory if needed
        run: |
          if [ ! -d "out" ]; then
            echo "out directory not found, checking .next directory"
            if [ -d ".next" ]; then
              echo "Copying .next to out"
              cp -r .next out
            else
              echo "Neither out nor .next directory found, creating empty out directory"
              mkdir -p out
              echo "<html><body><h1>Build Error</h1><p>No output directory found</p></body></html>" > out/index.html
            fi
          else
            echo "out directory found successfully"
            echo "Contents of out directory:"
            ls -la out/
            echo "Checking if index.html exists:"
            if [ -f "out/index.html" ]; then
              echo "index.html found"
              head -10 out/index.html
            else
              echo "index.html not found!"
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4